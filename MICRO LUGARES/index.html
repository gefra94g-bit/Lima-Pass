        ];

        let usuarioLat = -12.111; // Coordenada por defecto (Miraflores)
        let usuarioLon = -77.031;
        let lugarActualId = null;

        // OBTENER UBICACIÓN REAL DEL CELULAR
        function inicializarUbicacion() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    usuarioLat = position.coords.latitude;
                    usuarioLon = position.coords.longitude;
                    document.getElementById('ubicacionTexto').innerText = "Estás en Lima (GPS Activo)";
                    renderizarLugares();
                }, () => {
                    document.getElementById('ubicacionTexto').innerText = "Lima, Perú (Ubicación predeterminada)";
                    renderizarLugares();
                });
            } else {
                renderizarLugares();
            }
        }

        // Calcular distancia Haversine en KM
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1);
        }

        function renderizarLugares(filtro = 'todos', busqueda = '') {
            const container = document.getElementById('lugaresContainer');
            container.innerHTML = '';

            const filtrados = lugares.filter(l => {
                const coincideCat = filtro === 'todos' || l.cat === filtro;
                const coincideBusqueda = l.nombre.toLowerCase().includes(busqueda.toLowerCase()) || l.distrito.toLowerCase().includes(busqueda.toLowerCase());
                return coincideCat && coincideBusqueda;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-500 text-xs">No se encontraron establecimientos con ese criterio.</div>`;
                return;
            }

            filtrados.forEach(l => {
                const distanciaKm = calcularDistancia(usuarioLat, usuarioLon, l.lat, l.lon);
                container.innerHTML += `
                    <div class="bg-slate-900/90 rounded-3xl overflow-hidden border border-slate-800 shadow-xl group">
                        <div class="relative h-40 overflow-hidden">
                            <img src="${l.img}" alt="${l.nombre}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-extrabold text-amber-400 flex items-center gap-1 shadow">
                                <i class="fa-solid fa-star text-[10px]"></i> ${l.rating}
                            </div>
                            <div class="absolute bottom-3 left-3 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-semibold text-slate-200 shadow">
                                <i class="fa-solid fa-location-dot text-orange-500 mr-1"></i> ${l.distrito} • <span class="text-orange-400 font-bold">${distanciaKm} km de ti</span>
                            </div>
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-sm text-white">${l.nombre}</h3>
                                    <p class="text-[11px] text-slate-400">Abierto ahora en Lima</p>
                                </div>
                                <button onclick="darLike(${l.id})" class="text-slate-400 hover:text-red-500 flex items-center gap-1 text-xs transition active:scale-125">
                                    <i class="fa-solid fa-heart text-lg"></i> <span id="likes-${l.id}" class="text-xs font-bold">${l.likes}</span>
                                </button>
                            </div>
                            
                            <div class="flex gap-2 mt-3 pt-3 border-t border-slate-800/80">
                                <a href="${l.link}" target="_blank" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-center py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow">
                                    <i class="fa-solid fa-map-location-dot text-orange-500"></i> Ver Enlace
                                </a>
                                <button onclick="abrirResenas(${l.id})" class="bg-orange-500/10 hover:bg-orange-500/20 text-orange-400 px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1 border border-orange-500/20">
                                    <i class="fa-solid fa-comments"></i> (${l.resenas.length})
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarCategoria(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-orange-500', 'text-white', 'font-bold');
                b.classList.add('bg-slate-900', 'text-slate-300', 'font-semibold');
            });
            btn.classList.remove('bg-slate-900', 'text-slate-300', 'font-semibold');
            btn.classList.add('bg-orange-500', 'text-white', 'font-bold');
            
            const busqueda = document.getElementById('searchInput').value;
            renderizarLugares(cat, busqueda);
        }

        function filtrarApp() {
            renderizarLugares('todos', document.getElementById('searchInput').value);
        }

        function darLike(id) {
            const lugar = lugares.find(l => l.id === id);
            if(lugar) {
                lugar.likes++;
                document.getElementById(`likes-${id}`).innerText = lugar.likes;
            }
        }

        function abrirResenas(id) {
            lugarActualId = id;
            const lugar = lugares.find(l => l.id === id);
            document.getElementById('modalTitulo').innerText = `Reseñas: ${lugar.nombre}`;
            const lista = document.getElementById('listaResenas');
            lista.innerHTML = '';
            lugar.resenas.forEach(r => {
                lista.innerHTML += `
                    <div class="bg-slate-950 p-3 rounded-xl text-xs border border-slate-800">
                        <span class="font-bold text-orange-400">${r.u}</span>
                        <p class="text-slate-300 mt-0.5">${r.t}</p>
                    </div>
                `;
            });
            document.getElementById('modalResena').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modalResena').classList.add('hidden'); }
        
        function enviarResena() {
            const nombre = document.getElementById('nombreUsuario').value;
            const texto = document.getElementById('textoResena').value;
            if(!nombre || !texto) { alert("Por favor ingresa tu nombre y comentario."); return; }
            lugares.find(l => l.id === lugarActualId).resenas.push({u: nombre, t: texto});
            document.getElementById('nombreUsuario').value = '';
            document.getElementById('textoResena').value = '';
            abrirResenas(lugarActualId);
            renderizarLugares();
        }

        function abrirSuscripcion() { document.getElementById('modalSuscripcion').classList.remove('hidden'); }
        function cerrarSuscripcion() { document.getElementById('modalSuscripcion').classList.add('hidden'); }
        function pagarSuscripcion() {
            alert("Redirigiendo a pasarela segura Yape/Plin para activar tu Pase VIP por S/. 1.00 mensual.");
            cerrarSuscripcion();
        }

        function cambiarTab(tab) {
            if(tab === 'mapa') {
                alert("Cargando mapa interactivo geolocalizado de Lima...");
            } else if(tab === 'perfil') {
                alert("Panel de usuario LimaPass (Gratuito).");
            }
        }

        // Iniciar app detectando geolocalización
        inicializarUbicacion();
    </script>
</body>
</html>
